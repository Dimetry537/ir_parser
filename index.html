<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Парсер тестов Infourok (Мобильная версия)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f4f6f8;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { text-align: center; color: #2c3e50; font-size: 1.4rem; margin-top: 0; }
        .instructions {
            background: #e8f4fd;
            border-left: 4px solid #3498db;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.4;
        }
        
        /* Кнопка загрузки файла */
        .file-upload-wrapper {
            text-align: center;
            margin-bottom: 15px;
        }
        .file-upload-label {
            display: inline-block;
            padding: 14px 20px;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .file-upload-label:active { background-color: #2980b9; }
        #file-input { display: none; }
        
        .divider {
            text-align: center;
            margin: 15px 0;
            color: #7f8c8d;
            font-size: 14px;
            position: relative;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #ddd;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
        }
        .btn-process {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-process:active { background-color: #27ae60; }
        .btn-print {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }

        #result-area {
            margin-top: 20px;
            padding: 15px;
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            background: #fff;
            min-height: 200px;
            outline: none;
        }
        #result-area, #result-area * {
            font-family: 'Times New Roman', Times, serif;
            font-size: 14pt;
            line-height: 1.4;
            color: #000;
        }
        #result-area p { margin-bottom: 8px; }
        #result-area img { max-width: 100%; height: auto; display: block; margin: 10px auto; }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .no-print { display: none !important; }
            #result-area { border: none; padding: 0; margin: 0; font-size: 12pt; }
            img, p { page-break-inside: avoid; }
            @page { margin: 1cm; }
        }
   5.  **Шаг 5:** Откройте ваш сайт на GitHub Pages. Нажмите большую синюю кнопку **«📂 Загрузить скачанный файл»** и выберите тот самый `.html` файл, который вы только что скачали.
6.  **Шаг 6:** Сайт мгновенно обработает файл и покажет чистый тест. Нажмите синюю кнопку **«🖨️ Сохранить как PDF / Распечатать»**. В открывшемся меню выберите «Сохранить как PDF» или сразу отправьте на принтер.

> **💡 Совет для iPhone (iOS):** 
> Safari не умеет нормально сохранять страницы как `.html` (он сохраняет как `.webarchive`, который наш парсер не прочитает). 
> **Решение для iPhone:** Установите бесплатное приложение **"Documents by Readdle"** или любой браузер с функцией "Просмотр HTML-кода" (например, "View Source"). Скачайте страницу через него как `.html`, а затем загрузите этот файл на ваш сайт. Либо используйте Android-телефон, где в Chrome это делается в 2 касания (три точки → Скачать / Поделиться → Сохранить как HTML).

Этот метод полностью избавляет вас от необходимости выделять и копировать тысячи строк кода на маленьком экране!
